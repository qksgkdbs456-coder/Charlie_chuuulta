<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3포대 출타관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK 모듈 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, setDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDF0uMwfOHqLLWVQYAk8FPDHjnJPsMLceU",
            authDomain: "chulta-583d7.firebaseapp.com",
            projectId: "chulta-583d7",
            storageBucket: "chulta-583d7.firebasestorage.app",
            messagingSenderId: "975690657951",
            appId: "1:975690657951:web:d6d43417a95885070372aa",
            measurementId: "G-S1RXFC5GGW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;

        window.initFirebaseRealtimeSync();
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- 상단 헤더 (모바일 한 줄 정렬) -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex justify-between items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days text-emerald-400"></i> 3포대 출타관리
            </h1>
            <div id="header-auth-area" class="flex items-center gap-1.5 shrink-0">
                <button onclick="showPublicCalendar()" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 whitespace-nowrap">
                    <i class="fa-solid fa-calendar-days"></i> 달력 보기
                </button>
                <div id="auth-btn-container" class="shrink-0">
                    <button onclick="openAdminLoginModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold transition border border-slate-700 flex items-center gap-1 whitespace-nowrap">
                        <i class="fa-solid fa-lock"></i> 관리자 로그인
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-3 sm:px-4 py-4 space-y-6">
        
        <!-- [1] 사용자 페이지 (신청서 작성) -->
        <div id="user-page" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-7">
                <div class="border-b border-slate-100 pb-3 mb-5">
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900">출타 신청서 작성</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">휴가, 외출, 외박, 면회 신청을 위한 양식입니다. 신청 즉시 실시간 반영됩니다.</p>
                </div>
                
                <form id="leave-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">성명</label>
                        <input type="text" id="soldier-name" oninput="saveDraftForm()" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">군번</label>
                        <input type="text" id="soldier-serial" oninput="saveDraftForm()" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">계급</label>
                        <select id="soldier-rank" onchange="saveDraftForm()" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="">계급 선택</option>
                            <option value="이병">이병</option>
                            <option value="일병">일병</option>
                            <option value="상병">상병</option>
                            <option value="병장">병장</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">본인 연락처</label>
                        <input type="tel" id="soldier-phone" oninput="saveDraftForm()" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="010-0000-0000">
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">출타 구분</label>
                        <select id="leave-type" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="onLeaveTypeChange()">
                            <option value="">선택하세요</option>
                            <option value="휴가">휴가</option>
                            <option value="외출">외출</option>
                            <option value="외박">외박</option>
                            <option value="면회">면회</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">행선지</label>
                        <input type="text" id="destination" oninput="saveDraftForm()" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <!-- 외박 숙소 정보 -->
                    <div id="accommodation-section" class="hidden space-y-1">
                        <label class="block text-xs font-bold text-slate-700">숙소 정보</label>
                        <input type="text" id="accommodation" oninput="saveDraftForm()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="호텔/펜션 이름 등">
                    </div>

                    <!-- 시작일 / 종료일 (칸 너비 축소 디자인으로 겹침 방지) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="block text-xs font-bold text-slate-700">시작일</label>
                            <input type="date" id="start-date" onchange="saveDraftForm()" required class="w-full max-w-[150px] px-2 py-1.5 border border-slate-300 rounded-xl text-xs sm:text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-bold text-slate-700">종료일</label>
                            <input type="date" id="end-date" onchange="saveDraftForm()" required class="w-full max-w-[150px] px-2 py-1.5 border border-slate-300 rounded-xl text-xs sm:text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- 출타 사유 -->
                    <div id="reason-container" class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">출타 사유</label>
                        <textarea id="leave-reason" rows="2" oninput="saveDraftForm()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>

                    <!-- 외출/외박 동행 형태 라디오 -->
                    <div id="outing-sub-selector" class="hidden p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                        <label class="block text-xs font-bold text-slate-700">외출/외박 동행 형태</label>
                        <div class="flex gap-4 text-xs font-semibold">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="outing-sub-type" value="buddy" checked onchange="toggleOutingSubType()"> 전우조 동행
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="outing-sub-type" value="visitor" onchange="toggleOutingSubType()"> 면회객 동행
                            </label>
                        </div>
                    </div>

                    <!-- 전우조 동행 섹션 -->
                    <div id="buddy-section" class="hidden p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold text-slate-700"><i class="fa-solid fa-users text-emerald-600"></i> 전우조 동행인원 입력</h3>
                            <button type="button" onclick="addBuddyField()" class="bg-emerald-600 text-white px-2.5 py-1 rounded-lg text-xs font-semibold">+ 추가</button>
                        </div>
                        <div id="buddy-list" class="space-y-2"></div>
                    </div>

                    <!-- 면회객 정보 섹션 -->
                    <div id="visitor-section" class="hidden p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold text-slate-700"><i class="fa-solid fa-user-group text-emerald-600"></i> 면회객 정보 입력</h3>
                            <button type="button" id="add-visitor-btn" onclick="addVisitorField()" class="bg-emerald-600 text-white px-2.5 py-1 rounded-lg text-xs font-semibold">+ 추가</button>
                        </div>
                        <div id="visitor-list" class="space-y-2"></div>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                        출타 신청서 제출 (실시간 반영)
                    </button>
                </form>
            </div>
        </div>

        <!-- [2] 관리자 전용 페이지 -->
        <div id="admin-page" class="hidden space-y-5">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-600"></i> 관리자 페이지
                </h2>
                <p class="text-xs text-slate-500 mt-1">부대 정원 설정, 비밀번호 변경 및 카테고리별 독립 복사 양식을 관리합니다. (달력에서 출타자 클릭 시 삭제 가능)</p>
            </div>

            <!-- 관리자 기능 전환 탭 버튼 -->
            <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
                <button id="admin-tab-settings-btn" onclick="switchAdminTab('settings')" class="py-2 rounded-lg text-xs sm:text-sm font-bold transition bg-white text-slate-900 shadow-sm">
                    부대 정원 및 설정
                </button>
                <button id="admin-tab-copy-btn" onclick="switchAdminTab('copy')" class="py-2 rounded-lg text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900">
                    출타자 정보 복사
                </button>
            </div>

            <!-- TAB A: 부대 정원 및 설정 (비밀번호 변경 포함) -->
            <div id="admin-subtab-settings" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 space-y-5">
                <div class="space-y-4">
                    <h3 class="text-sm sm:text-base font-bold text-slate-900">부대 정원 및 출타율 한도 설정 (서버 동기화)</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">총 부대원 수</label>
                            <input type="number" id="set-troops" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">총 출타율 한도 (%)</label>
                            <input type="number" id="set-total-rate" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">휴가 출타율 한도 (%)</label>
                            <input type="number" id="set-vacation-rate" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>
                    <button onclick="saveAdminSettings()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition text-sm">
                        설정 저장 (서버 반영)
                    </button>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-3">
                    <h3 class="text-sm sm:text-base font-bold text-slate-900">관리자 비밀번호 변경</h3>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">새로운 비밀번호 입력</label>
                        <input type="password" id="new-admin-pw" placeholder="새 비밀번호 입력" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <button onclick="changeAdminPassword()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl transition text-sm">
                        비밀번호 변경 (서버 반영)
                    </button>
                </div>
            </div>

            <!-- TAB B: 출타자 정보 복사 -->
            <div id="admin-subtab-copy" class="hidden space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 space-y-3">
                    <div class="flex justify-between items-center gap-2">
                        <div class="flex items-center gap-1.5">
                            <button onclick="changeAdminCopyMonth(-1)" class="px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-50">
                                <i class="fa-solid fa-chevron-left"></i> 이전
                            </button>
                            <span id="admin-copy-month-label" class="text-sm font-black text-slate-800 px-2 min-w-[100px] text-center">2026년 10월</span>
                            <button onclick="changeAdminCopyMonth(1)" class="px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-50">
                                다음 <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <button onclick="toggleAdminCopyAllMonths()" id="admin-copy-all-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold">
                            전체 기간
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-500">선택된 기간의 신청 내역이 아래 카테고리별 양식에 맞추어 자동으로 생성됩니다.</p>
                </div>

                <div class="grid grid-cols-4 gap-1.5 bg-slate-200 p-1 rounded-xl">
                    <button id="cat-tab-vacation" onclick="switchCategoryCopyTab('vacation')" class="py-2 rounded-lg text-xs font-bold transition bg-white text-emerald-800 shadow-sm">
                        휴가
                    </button>
                    <button id="cat-tab-outing" onclick="switchCategoryCopyTab('outing')" class="py-2 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900">
                        외출
                    </button>
                    <button id="cat-tab-stay" onclick="switchCategoryCopyTab('stay')" class="py-2 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900">
                        외박
                    </button>
                    <button id="cat-tab-visit" onclick="switchCategoryCopyTab('visit')" class="py-2 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900">
                        면회
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 id="category-copy-title" class="text-sm font-bold text-slate-900">[휴가] 복사 양식</h4>
                        <button onclick="copyCurrentCategoryText()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                            <i class="fa-regular fa-copy"></i> 복사하기
                        </button>
                    </div>
                    <textarea id="category-copy-textarea" readonly class="w-full h-64 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono leading-relaxed focus:outline-none" placeholder="해당 기간 내역 없음"></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- 모달 컨테이너 -->
    <div id="modal-container"></div>

    <script>
        let settings = { totalTroops: 100, totalRate: 20, vacationRate: 15 };
        let adminPassword = localStorage.getItem('chulta_admin_pw') || '1234';
        let leaves = [];
        let isAdmin = false;
        let currentOpenDetailDate = null;

        // 복사 탭 월별 조회 상태
        let copyYear = new Date().getFullYear();
        let copyMonth = new Date().getMonth();
        let isCopyAllMonths = false;
        let currentCategoryTab = 'vacation';

        window.onload = function() {
            initDates();
            loadDraftForm();
            document.getElementById('set-troops').value = settings.totalTroops;
            document.getElementById('set-total-rate').value = settings.totalRate;
            document.getElementById('set-vacation-rate').value = settings.vacationRate;
        };

        function initDates() {
            const today = new Date().toISOString().split('T')[0];
            if (!document.getElementById('start-date').value) document.getElementById('start-date').value = today;
            if (!document.getElementById('end-date').value) document.getElementById('end-date').value = today;
        }

        // 입력 폼 내용 실시간 로컬스토리지 저장
        function saveDraftForm() {
            const draft = {
                name: document.getElementById('soldier-name').value,
                serial: document.getElementById('soldier-serial').value,
                rank: document.getElementById('soldier-rank').value,
                phone: document.getElementById('soldier-phone').value,
                type: document.getElementById('leave-type').value,
                destination: document.getElementById('destination').value,
                accommodation: document.getElementById('accommodation').value,
                startDate: document.getElementById('start-date').value,
                endDate: document.getElementById('end-date').value,
                reason: document.getElementById('leave-reason').value
            };
            localStorage.setItem('chulta_form_draft', JSON.stringify(draft));
        }

        // 로컬스토리지에서 임시 저장된 폼 불러오기
        function loadDraftForm() {
            const saved = localStorage.getItem('chulta_form_draft');
            if (saved) {
                try {
                    const draft = JSON.parse(saved);
                    if (draft.name) document.getElementById('soldier-name').value = draft.name;
                    if (draft.serial) document.getElementById('soldier-serial').value = draft.serial;
                    if (draft.rank) document.getElementById('soldier-rank').value = draft.rank;
                    if (draft.phone) document.getElementById('soldier-phone').value = draft.phone;
                    if (draft.type) {
                        document.getElementById('leave-type').value = draft.type;
                        onLeaveTypeChange();
                    }
                    if (draft.destination) document.getElementById('destination').value = draft.destination;
                    if (draft.accommodation) document.getElementById('accommodation').value = draft.accommodation;
                    if (draft.startDate) document.getElementById('start-date').value = draft.startDate;
                    if (draft.endDate) document.getElementById('end-date').value = draft.endDate;
                    if (draft.reason) document.getElementById('leave-reason').value = draft.reason;
                } catch (e) {
                    console.error("임시 저장 데이터 로드 오류", e);
                }
            }
        }

        function getLeaveHeadcount(leave) {
            let count = 1;
            if ((leave.type === '외출' || leave.type === '외박') && Array.isArray(leave.buddies)) {
                count += leave.buddies.filter(b => b.name && b.name.trim() !== '').length;
            }
            return count;
        }

        // Firebase 실시간 동기화 (출타 내역 + 부대 설정값 모두 서버 연동)
        window.initFirebaseRealtimeSync = function() {
            // 1. 부대 정원 및 출타율 설정 & 비밀번호 실시간 동기화
            const settingsDocRef = window.doc(window.db, "config", "settings");
            window.onSnapshot(settingsDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.totalTroops !== undefined) settings.totalTroops = data.totalTroops;
                    if (data.totalRate !== undefined) settings.totalRate = data.totalRate;
                    if (data.vacationRate !== undefined) settings.vacationRate = data.vacationRate;
                    if (data.adminPassword !== undefined) {
                        adminPassword = data.adminPassword;
                        localStorage.setItem('chulta_admin_pw', adminPassword);
                    }

                    const troopsInput = document.getElementById('set-troops');
                    const totalRateInput = document.getElementById('set-total-rate');
                    const vacRateInput = document.getElementById('set-vacation-rate');
                    if (troopsInput) troopsInput.value = settings.totalTroops;
                    if (totalRateInput) totalRateInput.value = settings.totalRate;
                    if (vacRateInput) vacRateInput.value = settings.vacationRate;

                    recalculateCapacities();
                    if (isAdmin) {
                        generateCategoryCopyTexts();
                    }
                    if (document.getElementById('cal-grid')) {
                        renderCalendarGrid();
                    }
                    if (currentOpenDetailDate && document.getElementById('sub-modal')) {
                        openDayDetailModal(currentOpenDetailDate);
                    }
                }
            });

            // 2. 출타 신청 내역 실시간 동기화
            const q = query(collection(window.db, "leaves"));
            window.onSnapshot(q, (snapshot) => {
                leaves = [];
                snapshot.forEach((docSnap) => {
                    leaves.push({ firebaseId: docSnap.id, ...docSnap.data() });
                });
                
                recalculateCapacities();
                if (isAdmin) {
                    generateCategoryCopyTexts();
                }
                if (document.getElementById('cal-grid')) {
                    renderCalendarGrid();
                }
                if (currentOpenDetailDate && document.getElementById('sub-modal')) {
                    openDayDetailModal(currentOpenDetailDate);
                }
            });
        };

        function formatShortDate(dStr) {
            if (!dStr) return '';
            const parts = dStr.split('-');
            if (parts.length < 3) return dStr;
            const d = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            return `${parseInt(parts[1])}.${parseInt(parts[2])}(${dayNames[d.getDay()]})`;
        }

        function formatSlashDate(dStr) {
            if (!dStr) return '';
            const parts = dStr.split('-');
            if (parts.length < 3) return dStr;
            const d = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            return `${String(parts[1]).padStart(2, '0')}/${String(parts[2]).padStart(2, '0')}(${dayNames[d.getDay()]})`;
        }

        function formatDotDateRange(sStr, eStr) {
            if (!sStr || !eStr) return '';
            const sParts = sStr.split('-');
            const eParts = eStr.split('-');
            const s = `${parseInt(sParts[1])}.${parseInt(sParts[2])}`;
            const e = `${parseInt(eParts[1])}.${parseInt(eParts[2])}`;
            const d1 = new Date(sStr);
            const d2 = new Date(eStr);
            const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            return `${s}~${e} (${diffDays}일)`;
        }

        function generateCategoryCopyTexts() {
            let filtered = leaves.filter(l => l.status === '승인');

            if (!isCopyAllMonths) {
                const ymPrefix = `${copyYear}-${String(copyMonth + 1).padStart(2, '0')}`;
                filtered = filtered.filter(l => {
                    const startYM = l.startDate ? l.startDate.substring(0, 7) : '';
                    const endYM = l.endDate ? l.endDate.substring(0, 7) : '';
                    return (startYM <= ymPrefix && endYM >= ymPrefix);
                });
            }

            const titleElem = document.getElementById('category-copy-title');
            const textareaElem = document.getElementById('category-copy-textarea');
            if (!titleElem || !textareaElem) return;

            let blocks = [];

            if (currentCategoryTab === 'vacation') {
                titleElem.innerText = "[휴가] 복사 양식";
                const vLeaves = filtered.filter(l => l.type === '휴가');
                blocks = vLeaves.map(l => {
                    return `[휴가]\n${l.rank} ${l.name} ${l.serial}\n휴가일자: ${formatDotDateRange(l.startDate, l.endDate)}\n휴가종류: ${l.reason || ''}\n행선지: ${l.destination || ''}\n연락처: ${l.phone || ''}`;
                });
            } else if (currentCategoryTab === 'outing') {
                titleElem.innerText = "[외출] 복사 양식";
                const oLeaves = filtered.filter(l => l.type === '외출');
                blocks = oLeaves.map(l => {
                    const tag = l.reason ? `[${l.reason}]` : '[외출]';
                    if (l.buddies && l.buddies.length > 0) {
                        let lines = [tag];
                        lines.push(`${l.rank} ${l.name} ${l.serial}`);
                        l.buddies.forEach(b => lines.push(`${b.rank} ${b.name} ${b.serial}`));
                        lines.push(`외출일자: ${formatShortDate(l.startDate)}`);
                        lines.push(`행선지: ${l.destination || ''}`);
                        lines.push(`${l.name}: ${l.phone || ''}`);
                        l.buddies.forEach(b => lines.push(`${b.name}: ${b.phone || ''}`));
                        return lines.join('\n');
                    } else if (l.visitors && l.visitors.length > 0) {
                        const v = l.visitors[0];
                        return `${tag}\n${l.rank} ${l.name} ${l.serial}\n연락처 : ${l.phone || ''}\n외출일자: ${formatShortDate(l.startDate)}\n면회객 : ${v.name || ''}(${v.relation || ''})\n면회객 연락처 : ${v.phone || ''}\n행선지 : ${l.destination || ''}`;
                    } else {
                        return `${tag}\n${l.rank} ${l.name} ${l.serial}\n외출일자: ${formatShortDate(l.startDate)}\n행선지: ${l.destination || ''}\n연락처: ${l.phone || ''}`;
                    }
                });
            } else if (currentCategoryTab === 'stay') {
                titleElem.innerText = "[외박] 복사 양식";
                const sLeaves = filtered.filter(l => l.type === '외박');
                blocks = sLeaves.map(l => {
                    const tag = l.reason ? `[${l.reason}]` : '[외박]';
                    if (l.buddies && l.buddies.length > 0) {
                        let lines = [tag];
                        lines.push(`${l.rank} ${l.name} ${l.serial}`);
                        l.buddies.forEach(b => lines.push(`${b.rank} ${b.name} ${b.serial}`));
                        lines.push(`외박일자: ${formatShortDate(l.startDate)} ~ ${formatShortDate(l.endDate)}`);
                        lines.push(`행선지: ${l.destination || ''}`);
                        if (l.accommodation) lines.push(`숙소: ${l.accommodation}`);
                        lines.push(`${l.name}: ${l.phone || ''}`);
                        l.buddies.forEach(b => lines.push(`${b.name}: ${b.phone || ''}`));
                        return lines.join('\n');
                    } else if (l.visitors && l.visitors.length > 0) {
                        const v = l.visitors[0];
                        let lines = [tag];
                        lines.push(`${l.rank} ${l.name} ${l.serial}`);
                        lines.push(`연락처 : ${l.phone || ''}`);
                        lines.push(`외박일자: ${formatShortDate(l.startDate)} ~ ${formatShortDate(l.endDate)}`);
                        lines.push(`면회객 : ${v.name || ''}(${v.relation || ''})`);
                        lines.push(`면회객 연락처 : ${v.phone || ''}`);
                        lines.push(`행선지 : ${l.destination || ''}`);
                        if (l.accommodation) lines.push(`숙소 : ${l.accommodation}`);
                        return lines.join('\n');
                    } else {
                        return `${tag}\n${l.rank} ${l.name} ${l.serial}\n외박일자: ${formatShortDate(l.startDate)} ~ ${formatShortDate(l.endDate)}\n행선지: ${l.destination || ''}\n숙소: ${l.accommodation || ''}\n연락처: ${l.phone || ''}`;
                    }

            } else if (currentCategoryTab === 'visit') {
                titleElem.innerText = "[면회] 복사 양식";
                const vLeaves = filtered.filter(l => l.type === '면회');
                blocks = vLeaves.map(l => {
                    let visitors = l.visitors || [];
                    let visitorLines = visitors.map(v => `${v.name}${v.relation ? '(' + v.relation + ')' : ''}${v.phone ? '(' + v.phone + ')' : ''}`);
                    let birthLines = visitors.map(v => {
                        let namePart = v.name || '';
                        let relPart = v.relation ? `(${v.relation})` : '';
                        let birthPart = `(${v.birth || ''})`;
                        return `${namePart}${relPart}${birthPart}`;
                    });
                    let address = visitors.length > 0 ? (visitors.find(v => v.address)?.address || visitors[0].address || '') : '';

                    return `[면회]\n${formatSlashDate(l.startDate)}\n면회자: ${l.rank} ${l.name} ${l.serial}\n(${l.phone || ''})\n면회객:\n${visitorLines.join('\n')}\n주소:${address}\n면회객 생년월일:\n${birthLines.join('\n')}`;
                });
            }

            textareaElem.value = blocks.length > 0 ? blocks.join('\n\n') : '';
        }

        function renderCalendarGrid() {
            const title = document.getElementById('cal-title');
            const grid = document.getElementById('cal-grid');
            if (!title || !grid) return;

            title.innerText = `${calYear}년 ${calMonth + 1}월 출타 현황`;
            grid.innerHTML = '';

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const lastDate = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="aspect-square rounded-lg bg-transparent"></div>`;
            }

            for (let d = 1; d <= lastDate; d++) {
                const dStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                const active = leaves.filter(l => l.startDate <= dStr && l.endDate >= dStr);
                
                const approvedCount = active
                    .filter(l => l.status === '승인')
                    .reduce((sum, l) => sum + getLeaveHeadcount(l), 0);

                const vacCount = active
                    .filter(l => l.status === '승인' && l.type === '휴가')
                    .reduce((sum, l) => sum + getLeaveHeadcount(l), 0);

                const standbyCount = active
                    .filter(l => l.status === '대기(초과)')
                    .reduce((sum, l) => sum + getLeaveHeadcount(l), 0);

                const cell = document.createElement('div');
                cell.className = "aspect-square border border-slate-200/90 rounded-lg p-1 flex flex-col justify-between bg-white hover:border-emerald-500 hover:shadow-sm cursor-pointer transition";
                cell.onclick = () => openDayDetailModal(dStr);

                let summaryHtml = `
                    <div class="space-y-0.5 text-center my-auto">
                        <div class="text-[9px] sm:text-[10px] font-bold text-slate-700 bg-slate-100 rounded py-0.5 leading-none">
                            총 ${approvedCount}명
                        </div>
                        <div class="text-[9px] sm:text-[10px] font-bold text-blue-600 bg-blue-50 rounded py-0.5 leading-none">
                            휴가 ${vacCount}명
                        </div>
                        ${standbyCount > 0 ? `<div class="text-[8px] sm:text-[9px] font-bold text-red-500 leading-none">대기 ${standbyCount}명</div>` : ''}
                    </div>
                `;

                cell.innerHTML = `
                    <div class="text-[10px] sm:text-xs font-bold text-slate-600">${d}</div>
                    ${summaryHtml}
                    <div></div>
                `;
                grid.appendChild(cell);
            }
        }

        function changeCalMonth(diff) {
            calMonth += diff;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            else if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCalendarGrid();
        }

        function openDayDetailModal(dStr) {
            currentOpenDetailDate = dStr;
            const active = leaves.filter(l => l.startDate <= dStr && l.endDate >= dStr);
            
            let expandedItems = [];
            active.forEach(l => {
                expandedItems.push({
                    firebaseId: l.firebaseId,
                    rank: l.rank,
                    name: l.name,
                    type: l.type,
                    status: l.status,
                    startDate: l.startDate,
                    endDate: l.endDate,
                    isBuddy: false,
                    buddyIndex: -1
                });

                if ((l.type === '외출' || l.type === '외박') && Array.isArray(l.buddies)) {
                    l.buddies.forEach((b, idx) => {
                        if (b.name && b.name.trim() !== '') {
                            expandedItems.push({
                                firebaseId: l.firebaseId,
                                rank: b.rank,
                                name: b.name,
                                type: l.type,
                                status: l.status,
                                startDate: l.startDate,
                                endDate: l.endDate,
                                isBuddy: true,
                                buddyIndex: idx
                            });
                        }
                    });
                }
            });

            let listHtml = '';
            if (expandedItems.length === 0) {
                listHtml = '<p class="text-xs text-slate-400 text-center py-4">출타자가 없습니다.</p>';
            } else {
                listHtml = expandedItems.map(item => {
                    const isStandby = item.status === '대기(초과)';
                    const adminClickAttr = isAdmin 
                        ? `onclick="handleAdminDeletePerson('${item.firebaseId}', ${item.isBuddy}, ${item.buddyIndex}, '${item.rank} ${item.name}')"` 
                        : '';
                    const adminHoverClass = isAdmin ? 'cursor-pointer hover:border-red-400 hover:bg-red-50/40 transition' : '';

                    return `
                        <div ${adminClickAttr} class="p-2.5 rounded-xl border ${isStandby ? 'bg-red-50/70 border-red-200' : 'bg-slate-50 border-slate-200'} ${adminHoverClass} flex justify-between items-center text-xs">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-bold ${isStandby ? 'text-red-700' : 'text-slate-900'}">${item.rank} ${item.name}</span>
                                <span class="text-slate-500 font-medium">(${item.type})</span>
                                ${isStandby ? '<span class="bg-red-100 text-red-700 text-[10px] px-1.5 py-0.5 rounded font-bold">초과대기</span>' : ''}
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-[11px] text-slate-500">${item.startDate} ~ ${item.endDate}</span>
                                ${isAdmin ? '<span class="text-red-500 hover:text-red-700 px-1"><i class="fa-solid fa-trash-can"></i></span>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const existingSub = document.getElementById('sub-modal');
            if (existingSub) existingSub.remove();

            let html = `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4">
                    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
                        <div class="border-b border-slate-100 pb-2 flex justify-between items-center">
                            <h4 class="font-bold text-slate-900 text-sm">${dStr} 출타자 명단 (${expandedItems.length}명)</h4>
                            ${isAdmin ? '<span class="text-[11px] font-bold text-red-500">이름 터치 시 삭제</span>' : ''}
                        </div>
                        <div class="max-h-64 overflow-y-auto space-y-2">
                            ${listHtml}
                        </div>
                        <button onclick="closeSubModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-xl text-xs font-bold">닫기</button>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.id = 'sub-modal';
            div.innerHTML = html;
            document.body.appendChild(div);
        }

        async function handleAdminDeletePerson(firebaseId, isBuddy, buddyIndex, personLabel) {
            if (!isAdmin) return;
            const targetLeave = leaves.find(l => l.firebaseId === firebaseId);
            if (!targetLeave) return;

            try {
                if (isBuddy) {
                    const confirmBuddy = confirm(`[${personLabel}] 동행인원을 명단에서 삭제하시겠습니까?\n(확인을 누르면 해당 동행인원만 제외됩니다.)`);
                    if (!confirmBuddy) return;

                    const updatedBuddies = targetLeave.buddies.filter((_, idx) => idx !== buddyIndex);
                    await window.updateDoc(window.doc(window.db, "leaves", firebaseId), {
                        buddies: updatedBuddies
                    });
                    alert(`${personLabel} 인원이 삭제되었습니다.`);
                } else {
                    const hasBuddies = Array.isArray(targetLeave.buddies) && targetLeave.buddies.length > 0;
                    const msg = hasBuddies
                        ? `[${personLabel}] 신청자의 출타 신청을 정말 삭제하시겠습니까?\n(주의: 함께 등록된 동행인원 ${targetLeave.buddies.length}명도 함께 삭제됩니다.)`
                        : `[${personLabel}] 인원의 출타 신청을 정말 삭제하시겠습니까?`;

                    if (!confirm(msg)) return;

                    await window.deleteDoc(window.doc(window.db, "leaves", firebaseId));
                    alert(`${personLabel} 출타 신청이 삭제되었습니다.`);
                }
            } catch (err) {
                console.error("삭제 오류:", err);
                alert("삭제 중 오류가 발생했습니다.");
            }
        }

        function closeSubModal() {
            currentOpenDetailDate = null;
            const sm = document.getElementById('sub-modal');
            if (sm) sm.remove();
        }

        function onLeaveTypeChange() {
            saveDraftForm();
            const type = document.getElementById('leave-type').value;
            const reasonContainer = document.getElementById('reason-container');
            const reasonInput = document.getElementById('leave-reason');
            const outingSubSelector = document.getElementById('outing-sub-selector');
            const buddySection = document.getElementById('buddy-section');
            const visitorSection = document.getElementById('visitor-section');
            const accommodationSection = document.getElementById('accommodation-section');

            reasonContainer.style.display = 'block';
            reasonInput.placeholder = "";
            outingSubSelector.style.display = 'none';
            buddySection.style.display = 'none';
            visitorSection.style.display = 'none';
            accommodationSection.style.display = 'none';
            document.getElementById('visitor-list').innerHTML = '';
            document.getElementById('buddy-list').innerHTML = '';

            if (type === '휴가') {
                reasonInput.placeholder = "예: 연가 4일, 구직청원 2일";
            } else if (type === '외출') {
                reasonInput.placeholder = "예: 평일 전우조 외출";
                outingSubSelector.style.display = 'block';
                toggleOutingSubType();
            } else if (type === '외박') {
                reasonInput.placeholder = "예: 주말 면회 외박";
                accommodationSection.style.display = 'block';
                outingSubSelector.style.display = 'block';
                toggleOutingSubType();
            } else if (type === '면회') {
                reasonContainer.style.display = 'none';
                visitorSection.style.display = 'block';
                addVisitorField();
            }
        }

        function toggleOutingSubType() {
            const subType = document.querySelector('input[name="outing-sub-type"]:checked').value;
            const buddySection = document.getElementById('buddy-section');
            const visitorSection = document.getElementById('visitor-section');

            if (subType === 'buddy') {
                buddySection.style.display = 'block';
                visitorSection.style.display = 'none';
                if (document.getElementById('buddy-list').children.length === 0) addBuddyField();
            } else {
                buddySection.style.display = 'none';
                visitorSection.style.display = 'block';
                if (document.getElementById('visitor-list').children.length === 0) addVisitorField();
            }
        }

        function addBuddyField() {
            const list = document.getElementById('buddy-list');
            const div = document.createElement('div');
            div.className = "space-y-2 bg-white p-2.5 rounded-xl border border-slate-200 text-xs";
            div.innerHTML = `
                <div class="grid grid-cols-2 gap-2">
                    <select class="buddy-rank w-full px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white">
                        <option value="이병">이병</option>
                        <option value="일병">일병</option>
                        <option value="상병">상병</option>
                        <option value="병장" selected>병장</option>
                    </select>
                    <input type="text" class="buddy-name w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="성명">
                </div>
                <input type="text" class="buddy-serial w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="군번">
                <input type="tel" class="buddy-phone w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="연락처">
                <div class="flex justify-end">
                    <button type="button" onclick="this.closest('.space-y-2').remove()" class="text-red-500 font-semibold text-[11px] flex items-center gap-1"><i class="fa-solid fa-trash"></i> 삭제</button>
                </div>
            `;
            list.appendChild(div);
        }

        function addVisitorField() {
            const list = document.getElementById('visitor-list');
            const isFirst = list.children.length === 0;
            const div = document.createElement('div');
            div.className = "space-y-2 bg-white p-2.5 rounded-xl border border-slate-200 text-xs";
            const isPureVisit = document.getElementById('leave-type').value === '면회';

            let innerHtml = `
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" class="visitor-name w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="면회객 성명">
                    <input type="text" class="visitor-relation w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="관계 (예: 어머니, 아버지)">
                </div>
                <input type="tel" class="visitor-phone w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="면회객 연락처">
            `;

            if (isPureVisit) {
                innerHtml += `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" class="visitor-birth w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="생년월일 (예: 78.01.16)">
                `;
                if (isFirst) {
                    innerHtml += `<input type="text" class="visitor-address w-full px-2.5 py-1.5 border border-slate-300 rounded-lg" placeholder="주소">`;
                } else {
                    innerHtml += `<div></div>`;
                }
                innerHtml += `</div>`;
            }

            innerHtml += `
                <div class="flex justify-end">
                    <button type="button" onclick="this.closest('.space-y-2').remove()" class="text-red-500 font-semibold text-[11px] flex items-center gap-1"><i class="fa-solid fa-trash"></i> 삭제</button>
                </div>
            `;

            div.innerHTML = innerHtml;
            list.appendChild(div);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('leave-type').value;
            
            // 첫 번째 면회객의 주소를 이후 면회객 데이터에도 공통으로 반영하기 위해 추출
            let sharedAddress = '';
            const firstAddressInput = document.querySelector('.visitor-address');
            if (firstAddressInput) {
                sharedAddress = firstAddressInput.value.trim();
            }

            const newLeave = {
                id: Date.now(),
                name: document.getElementById('soldier-name').value,
                serial: document.getElementById('soldier-serial').value,
                rank: document.getElementById('soldier-rank').value,
                phone: document.getElementById('soldier-phone').value,
                type: type,
                destination: document.getElementById('destination').value,
                accommodation: document.getElementById('accommodation').value,
                startDate: document.getElementById('start-date').value,
                endDate: document.getElementById('end-date').value,
                reason: type === '면회' ? '면회' : document.getElementById('leave-reason').value,
                status: '승인',
                buddies: [],
                visitors: []
            };

            if ((type === '외출' || type === '외박') && document.querySelector('input[name="outing-sub-type"]:checked').value === 'buddy') {
                document.querySelectorAll('#buddy-list > div').forEach(el => {
                    const bName = el.querySelector('.buddy-name').value.trim();
                    if (bName) {
                        newLeave.buddies.push({
                            rank: el.querySelector('.buddy-rank').value,
                            name: bName,
                            serial: el.querySelector('.buddy-serial').value.trim(),
                            phone: el.querySelector('.buddy-phone').value.trim()
                        });
                    }
                });
            } else {
                document.querySelectorAll('#visitor-list > div').forEach(el => {
                    const vName = el.querySelector('.visitor-name').value.trim();
                    if (vName) {
                        const addrEl = el.querySelector('.visitor-address');
                        let vAddress = addrEl ? addrEl.value.trim() : sharedAddress;
                        if (!vAddress) vAddress = sharedAddress;

                        newLeave.visitors.push({
                            name: vName,
                            relation: el.querySelector('.visitor-relation').value.trim(),
                            phone: el.querySelector('.visitor-phone').value.trim(),
                            birth: el.querySelector('.visitor-birth') ? el.querySelector('.visitor-birth').value.trim() : '',
                            address: vAddress
                        });
                    }
                });
            }

            try {
                await window.addDoc(window.collection(window.db, "leaves"), newLeave);
                alert("출타 신청서가 정상적으로 제출 및 반영되었습니다.");
                localStorage.removeItem('chulta_form_draft');
                document.getElementById('leave-form').reset();
                initDates();
            } catch (error) {
                console.error("데이터 전송 오류: ", error);
                alert("신청 중 오류가 발생했습니다.");
            }
        }

        // 출타율 정원 초과 계산 (휴가는 외출/외박에 절대 밀리지 않음, 면회 완전 제외, 그룹별 방식 B 적용)
        function recalculateCapacities() {
            leaves.forEach(l => l.status = '승인');

            const maxTotalLimit = Math.floor(settings.totalTroops * (settings.totalRate / 100));
            const maxVacationLimit = Math.floor(settings.totalTroops * (settings.vacationRate / 100));

            while (true) {
                let activeByDateTotal = {};
                let activeByDateVacation = {};

                let approvedFiltered = leaves.filter(l => l.status === '승인' && l.type !== '면회');

                approvedFiltered.forEach(l => {
                    let headcount = getLeaveHeadcount(l);
                    let curr = new Date(l.startDate);
                    let end = new Date(l.endDate);
                    while (curr <= end) {
                        let dStr = curr.toISOString().split('T')[0];
                        activeByDateTotal[dStr] = (activeByDateTotal[dStr] || 0) + headcount;
                        if (l.type === '휴가') {
                            activeByDateVacation[dStr] = (activeByDateVacation[dStr] || 0) + headcount;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                });

                let overflowDate = null;
                let isVacationOverflow = false;

                for (let dStr in activeByDateTotal) {
                    if (activeByDateVacation[dStr] && activeByDateVacation[dStr] > maxVacationLimit) {
                        overflowDate = dStr;
                        isVacationOverflow = true;
                        break;
                    }
                    if (activeByDateTotal[dStr] > maxTotalLimit) {
                        overflowDate = dStr;
                        isVacationOverflow = false;
                        break;
                    }
                }

                if (!overflowDate) break;

                let candidates = approvedFiltered.filter(l => l.startDate <= overflowDate && l.endDate >= overflowDate);
                
                if (isVacationOverflow) {
                    candidates = candidates.filter(l => l.type === '휴가');
                } else {
                    candidates = candidates.filter(l => l.type === '외출' || l.type === '외박');
                }

                if (candidates.length === 0) break;

                candidates.sort((a, b) => {
                    let aPrevEnd = getLatestPreviousEndDate(a);
                    let bPrevEnd = getLatestPreviousEndDate(b);
                    if (aPrevEnd && bPrevEnd) return bPrevEnd - aPrevEnd;
                    if (aPrevEnd) return -1;
                    if (bPrevEnd) return 1;
                    return new Date(b.endDate) - new Date(a.endDate);
                });

                let targetToQueue = candidates[0];
                let found = leaves.find(l => l.id === targetToQueue.id && l.firebaseId === targetToQueue.firebaseId);
                if (found) {
                    found.status = '대기(초과)';
                } else {
                    break;
                }
            }
        }

        function getLatestPreviousEndDate(targetLeave) {
            let latest = null;
            leaves.forEach(l => {
                if (l.firebaseId === targetLeave.firebaseId) return;
                if (l.status !== '승인') return;
                if (l.serial && targetLeave.serial && l.serial === targetLeave.serial) {
                    if (l.endDate < targetLeave.startDate) {
                        let eDate = new Date(l.endDate);
                        if (!latest || eDate > latest) {
                            latest = eDate;
                        }
                    }
                }
            });
            return latest;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }
    </script>
